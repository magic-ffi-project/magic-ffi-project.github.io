<header class="site-header">
  <div class="container">
    <a class="site-logo" href="{{ '/' | relative_url }}">
      <span class="site-logo__acronym">MAGIC</span>
      <span class="site-logo__tagline">Meeting Automotive Liability<br>Challenges through Forensics</span>
    </a>

    <button class="nav-toggle" aria-label="Toggle navigation" onclick="document.querySelector('.site-nav').classList.toggle('is-open')">
      <span></span><span></span><span></span>
    </button>

    <nav class="site-nav" role="navigation">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} class="active"{% endif %}>Home</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url contains '/about' %} class="active"{% endif %}>About</a>
      <a href="{{ '/work-packages/' | relative_url }}"{% if page.url contains '/work-packages' %} class="active"{% endif %}>Work Packages</a>
      <a href="{{ '/partners/' | relative_url }}"{% if page.url contains '/partners' %} class="active"{% endif %}>Partners</a>
      <a href="{{ '/publications/' | relative_url }}"{% if page.url contains '/publications' %} class="active"{% endif %}>Publications</a>
      <a href="{{ '/contact/' | relative_url }}"{% if page.url contains '/contact' %} class="active"{% endif %}>Contact</a>
    </nav>
  </div>
</header>
