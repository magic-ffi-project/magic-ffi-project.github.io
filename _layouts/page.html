---
layout: default
---

<div class="page-hero">
  <div class="container">
    <div class="breadcrumb">
      <a href="{{ '/' | relative_url }}">Home</a> &rsaquo; {{ page.title }}
    </div>
    <h1>{{ page.title }}</h1>
    {% if page.description %}
    <p>{{ page.description }}</p>
    {% endif %}
  </div>
</div>

<div class="page-content">
  <div class="container">
    {{ content }}
  </div>
</div>
