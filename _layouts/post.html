---
layout: default
---

<div class="page-hero">
  <div class="container">
    <div class="breadcrumb">
      <a href="{{ '/' | relative_url }}">Home</a> &rsaquo; {{ page.title }}
    </div>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p>{{ page.description }}</p>{% endif %}
  </div>
</div>

<article class="page-content">
  <div class="container">
    <div class="post-meta" style="margin-bottom:1.5rem; color: var(--color-text-muted); font-size:.875rem;">
      {% if page.date %}<time>{{ page.date | date: "%B %-d, %Y" }}</time>{% endif %}
    </div>
    {{ content }}
  </div>
</article>
